[project]
name = "crtboard"
version = "0.1.0"
description = "crtboardd, the local data daemon for CRTBOARD, and crtboardctl to run it"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.144",
  "uvicorn>=0.54",
  "httpx>=0.28",
  "pyyaml>=6.0",
]

[project.scripts]
crtboardd = "crtboard.daemon:main"
crtboardctl = "crtboard.ctl:main"

[dependency-groups]
dev = ["pytest>=9.1", "ruff>=0.17"]

[build-system]
requires = ["hatchling>=1.32"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crtboard"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
