# Lints, tests and builds the crtboard wheel (crtboardd and crtboardctl).
# Pushing a crtboard-v<version> tag also publishes it as a GitHub Release.
name: Python

on:
  # No path filter on pushes: it would also skip release tags.
  push:
    branches: [main]
    tags: ["crtboard-v*"]
  pull_request:
    paths:
      - "daemon/**"
      - ".github/workflows/python.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0  # publishes no moving major tag
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: crtboard-wheel
          path: daemon/dist/

  release:
    if: startsWith(github.ref, 'refs/tags/crtboard-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: crtboard-wheel
          path: dist
      - name: Check the tag matches the package version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' daemon/pyproject.toml)"
          test "${GITHUB_REF_NAME}" = "crtboard-v${version}"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "crtboard ${GITHUB_REF_NAME#crtboard-v}" --generate-notes
