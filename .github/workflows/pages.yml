# Publishes web/ to GitHub Pages when it changes on main: the serial upload
# test page at <pages url>/serial-upload/ and the built crtboard-web app at
# <pages url>/crtboard-web/.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deployment finish rather than cancelling it halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/crtboard-web/package-lock.json
      - name: Build crtboard-web
        working-directory: web/crtboard-web
        run: |
          npm ci
          npm run check
          npm test
          npm run build
      # The app's sources stay out of the site; only its build is published.
      - name: Assemble site
        run: |
          mkdir -p site
          rsync -a --exclude crtboard-web web/ site/
          cp -r web/crtboard-web/dist site/crtboard-web
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
